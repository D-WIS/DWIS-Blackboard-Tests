# The MQTT broker of the test stack (M4.4, T-BC-2): what the SmartConnect bridge expects of the real broker, mutual
# TLS and a user name with a password on 8883, and a plain listener for the test publisher that only the broker's
# own container can reach (docker compose exec mosquitto mosquitto_pub -h 127.0.0.1 -p 1883 ...).
# The certificates and the password file are made by make-certs.sh; nothing here is a secret.
per_listener_settings true

listener 8883
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/broker.crt
keyfile /mosquitto/config/certs/broker.key
require_certificate true
allow_anonymous false
password_file /mosquitto/config/certs/passwd

listener 1883 127.0.0.1
allow_anonymous true
