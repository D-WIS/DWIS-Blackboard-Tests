# DWIS Blackboard Rig Edition: the store, the semantic service (milestone 1, issues M1.3 and M1.7) and the
# real-time process (milestone 4, Tests #22).
#
#   docker compose up -d             build the images, start Fuseki, load the vocabulary, start the services
#   docker compose wait vocabulary   exit code 0 once the vocabulary is loaded and checked
#   ./smoke.sh                       all of the above plus the checks and demos of milestones 1 to 4
#
# Ports 3030 (Fuseki), 8080 (the service's internal API, specification 3.4) and 8081 (its gRPC service,
# specification 3.3) are published on localhost only, for inspection in the lab profile (specification 7,
# T-EP-2). Port 48030 is the OPC UA endpoint of the real-time process, the old server's address, published
# on localhost too: the applications on this machine connect to opc.tcp://localhost:48030 as they always did.
#
# The semantic image is digiwells/dwis.blackboard.semantic (SEMANTIC_TAG, default edge, pushed by the
# merge workflow of DWIS-Blackboard-Semantic). When it is not at hand, `docker compose build` builds it
# from a checkout of DWIS-Blackboard-Semantic at SEMANTIC_SOURCE (default: the sibling folder of this
# repository). The real-time image is digiwells/dwis.blackboard.realtime (REALTIME_TAG, default edge,
# pushed by the merge workflow of DWIS-Blackboard-RealTime), built from REALTIME_SOURCE the same way.
# The Fuseki image is digiwells/dwis.blackboard.fuseki (FUSEKI_TAG, default dev, built from ../fuseki;
# the merge workflow of this repository pushes edge). `docker compose pull` fetches the published tags
# instead of building.

name: dwis-blackboard

services:
  fuseki:
    build:
      context: ../fuseki
      args:
        JENA_VERSION: "6.2.0"
        # The runtime base; keep it on the Alpine release of eclipse-temurin:21-alpine (3.24 in November 2026).
        ALPINE_VERSION: "3.24"
    image: digiwells/dwis.blackboard.fuseki:${FUSEKI_TAG:-dev}
    environment:
      JAVA_OPTIONS: -Xmx2g -Xms512m
    ports:
      - "127.0.0.1:3030:3030"
    volumes:
      - fuseki-databases:/fuseki/databases
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3030/$$/ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  vocabulary:
    # One-shot: loads the pinned vocabulary and shapes into the vocabulary graph of /dwis after
    # translating http://ddhub.no/ to http://d-wis.org/ (decisions D-19, D-30), then checks it.
    image: curlimages/curl:8.23.0
    depends_on:
      fuseki:
        condition: service_healthy
    environment:
      FUSEKI_URL: http://fuseki:3030
      VOCABULARY_VERSION: ${VOCABULARY_VERSION:-2026-10-14}
    volumes:
      - ../fixtures/vocabulary:/vocabulary:ro
      - ./load-vocabulary.sh:/load-vocabulary.sh:ro
    entrypoint: ["/bin/sh", "/load-vocabulary.sh"]
    restart: "no"

  semantic:
    # The semantic service (DWIS-Blackboard-Semantic): reads the vocabulary and the units from the store
    # at start-up, so it starts after the loader; its health says why until both graphs are there.
    build:
      context: ${SEMANTIC_SOURCE:-../../DWIS-Blackboard-Semantic}
    image: digiwells/dwis.blackboard.semantic:${SEMANTIC_TAG:-edge}
    depends_on:
      fuseki:
        condition: service_healthy
      vocabulary:
        condition: service_completed_successfully
    environment:
      # Specification section 8, layer 4: DWIS__Section__Key.
      DWIS__Store__BaseUrl: http://fuseki:3030/
      DWIS__Vocabulary__Version: ${VOCABULARY_VERSION:-2026-10-14}
      DWIS__Validation__PolicyFile: /config/validation-policy.json
    volumes:
      - ../fixtures/vocabulary/validation-policy.json:/config/validation-policy.json:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    restart: unless-stopped

  realtime:
    # The real-time process (DWIS-Blackboard-RealTime): the OPC UA server with the DDHubServer object the old
    # clients call. It talks to the semantic service over gRPC on the stack's network, keeps retrying until the
    # service answers its list of manifests, then creates the folders and variables of every live manifest
    # (R-RT-6). Its endpoint names localhost, as the old server did, so that a client on this machine matches
    # the endpoint it asked for; a client inside the network reaches it as opc.tcp://realtime:48030.
    # The host name is fixed: the application certificate kept in the realtime-pki volume names the host it was
    # made on, and the process refuses to start with a certificate for another host, so a container recreated
    # from a new image must have the same name as the one that made the certificate.
    build:
      context: ${REALTIME_SOURCE:-../../DWIS-Blackboard-RealTime}
    image: digiwells/dwis.blackboard.realtime:${REALTIME_TAG:-edge}
    hostname: realtime
    depends_on:
      semantic:
        condition: service_started
    environment:
      DWIS__RealTime__SemanticAddress: http://semantic:8081
      DWIS__RealTime__EndpointUrl: opc.tcp://localhost:48030
      # The hub role (M5.3, specification 6): off while HUB_URL is empty; hub.sh sets it to the hub of the profile below.
      DWIS__RealTime__Hub__Url: ${HUB_URL:-}
      DWIS__RealTime__Hub__Group: ${HUB_GROUP:-default}
      DWIS__RealTime__Hub__Site: rig-a
    ports:
      - "127.0.0.1:48030:48030"
    volumes:
      - realtime-pki:/app/pki
    restart: unless-stopped

  # The "hub" profile (M5.3, Tests #33; T-HUB-1, T-HUB-2): the old DWIS hub, digiwells/dwissignalr (HUB_TAG, default
  # latest, the image the rigs replicate through today, unchanged), and a second Blackboard, "b": its own Fuseki,
  # vocabulary loader, semantic service and real-time process on the next ports (3031, 8090 and 8091, 48031). Both
  # real-time processes join the same group of the hub, so a value written on one is read on the other and a manifest
  # injected on one arrives on the other through the hub (R-HUB-1 to R-HUB-3). The hub serves /dwishub under the path
  # the rigs use, /blackboard/applications; the processes retry until it answers, so it has no health check.
  hub:
    profiles: [hub]
    image: digiwells/dwissignalr:${HUB_TAG:-latest}
    command: --path /blackboard/applications
    ports:
      - "127.0.0.1:8082:8080" # for inspection from this machine: http://127.0.0.1:8082/blackboard/applications/dwishub
    restart: unless-stopped

  fuseki-b:
    profiles: [hub]
    image: digiwells/dwis.blackboard.fuseki:${FUSEKI_TAG:-dev}
    environment:
      JAVA_OPTIONS: -Xmx2g -Xms512m
    ports:
      - "127.0.0.1:3031:3030"
    volumes:
      - fuseki-b-databases:/fuseki/databases
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3030/$$/ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  vocabulary-b:
    profiles: [hub]
    image: curlimages/curl:8.23.0
    depends_on:
      fuseki-b:
        condition: service_healthy
    environment:
      FUSEKI_URL: http://fuseki-b:3030
      VOCABULARY_VERSION: ${VOCABULARY_VERSION:-2026-10-14}
    volumes:
      - ../fixtures/vocabulary:/vocabulary:ro
      - ./load-vocabulary.sh:/load-vocabulary.sh:ro
    entrypoint: ["/bin/sh", "/load-vocabulary.sh"]
    restart: "no"

  semantic-b:
    profiles: [hub]
    image: digiwells/dwis.blackboard.semantic:${SEMANTIC_TAG:-edge}
    depends_on:
      fuseki-b:
        condition: service_healthy
      vocabulary-b:
        condition: service_completed_successfully
    environment:
      DWIS__Store__BaseUrl: http://fuseki-b:3030/
      DWIS__Vocabulary__Version: ${VOCABULARY_VERSION:-2026-10-14}
      DWIS__Validation__PolicyFile: /config/validation-policy.json
    volumes:
      - ../fixtures/vocabulary/validation-policy.json:/config/validation-policy.json:ro
    ports:
      - "127.0.0.1:8090:8080"
      - "127.0.0.1:8091:8081"
    restart: unless-stopped

  realtime-b:
    profiles: [hub]
    image: digiwells/dwis.blackboard.realtime:${REALTIME_TAG:-edge}
    hostname: realtime-b
    depends_on:
      semantic-b:
        condition: service_started
      hub:
        condition: service_started
    environment:
      DWIS__RealTime__SemanticAddress: http://semantic-b:8081
      DWIS__RealTime__EndpointUrl: opc.tcp://localhost:48031
      DWIS__RealTime__Hub__Url: http://hub:8080/blackboard/applications
      DWIS__RealTime__Hub__Group: ${HUB_GROUP:-default}
      DWIS__RealTime__Hub__Site: rig-b
    ports:
      - "127.0.0.1:48031:48031"
    volumes:
      - realtime-b-pki:/app/pki
    restart: unless-stopped

  # The "bridge" profile (M4.4, T-BC-2): the MQTT broker the SmartConnect bridge expects (mutual TLS, a password) and
  # the bridge image of the old demo, unchanged, talking to the real-time process by its service name. Started by
  # bridge.sh, which makes the certificates first: docker compose --profile bridge up -d mosquitto bridge.
  mosquitto:
    profiles: [bridge]
    image: eclipse-mosquitto:2.0
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mqtt/certs:/mosquitto/config/certs:ro
    # Nothing published: the bridge reaches 8883 on the network, the test publisher 1883 inside the container.

  bridge:
    profiles: [bridge]
    image: digiwells/dwis.smartconnect.bridge:${BRIDGE_TAG:-latest}
    depends_on:
      mosquitto:
        condition: service_started
      realtime:
        condition: service_started
    environment:
      DWIS_Mqtt__Host: mosquitto
      DWIS_Mqtt__Port: "8883"
      DWIS_Mqtt__Username: bridge
      DWIS_Mqtt__Password: bridge-secret # the test broker's; see mqtt/make-certs.sh
      DWIS_Mqtt__CaCertificatePath: /certs/ca.crt
      DWIS_Mqtt__ClientCertificatePath: /certs/client.crt
      DWIS_Mqtt__ClientKeyPath: /certs/client.key
      DWIS_Output__Enabled: "false"
      BLACKBOARD_URL: opc.tcp://realtime:48030
    volumes:
      - ./mqtt/certs:/certs:ro
    restart: unless-stopped

volumes:
  fuseki-databases:
  realtime-pki:
  fuseki-b-databases:
  realtime-b-pki:
