name: Suites against edge
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [semantic-edge, realtime-edge]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: suites-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  fuseki-image:
    name: Build and push the Fuseki image
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Set in the organisation secret store; until they exist the image is built but not pushed.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Note when the Docker Hub secrets are missing
        if: hashFiles('fuseki/Dockerfile') != '' && env.DOCKERHUB_USERNAME == ''
        run: echo "::notice::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not set; the image is built and scanned but not pushed."
      - name: Log in to Docker Hub
        if: hashFiles('fuseki/Dockerfile') != '' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Build the image, push sha and edge tags when logged in
        if: hashFiles('fuseki/Dockerfile') != ''
        uses: docker/build-push-action@v7
        with:
          context: fuseki
          build-args: |
            JENA_VERSION=6.2.0
          push: ${{ env.DOCKERHUB_USERNAME != '' }}
          load: ${{ env.DOCKERHUB_USERNAME == '' }}
          tags: |
            digiwells/dwis.blackboard.fuseki:sha-${{ github.sha }}
            digiwells/dwis.blackboard.fuseki:edge
      - name: Scan the image
        if: hashFiles('fuseki/Dockerfile') != ''
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: digiwells/dwis.blackboard.fuseki:sha-${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
  suites:
    name: Integration, compatibility and replication suites
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEMANTIC_IMAGE: ${{ github.event.client_payload.image || 'digiwells/dwis.blackboard.semantic:edge' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Find the solution
        id: sln
        run: |
          f=$(ls *.sln *.slnx 2>/dev/null | head -1 || true)
          echo "file=$f" >> "$GITHUB_OUTPUT"
          if [ -z "$f" ]; then echo "No solution yet; nothing to build."; fi
      - name: Restore
        if: steps.sln.outputs.file != ''
        run: dotnet restore "${{ steps.sln.outputs.file }}"
      - name: Build
        if: steps.sln.outputs.file != ''
        run: dotnet build "${{ steps.sln.outputs.file }}" -c Release --no-restore
      - name: Test
        if: steps.sln.outputs.file != ''
        run: dotnet test "${{ steps.sln.outputs.file }}" -c Release --no-build --report-trx --results-directory TestResults
      - name: Upload test results
        if: always() && steps.sln.outputs.file != ''
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Performance suite (nightly only)
        if: github.event_name == 'schedule' && steps.sln.outputs.file != ''
        run: echo "Performance suite arrives in milestone 5."
      - name: Keep the results 30 days
        if: always() && steps.sln.outputs.file != ''
        uses: actions/upload-artifact@v7
        with:
          name: suite-results-${{ github.run_number }}
          path: TestResults
          retention-days: 30
          if-no-files-found: ignore
