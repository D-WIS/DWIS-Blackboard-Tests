name: Pull request
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so that the Fuseki step below can diff against the base branch.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          # 10 builds and runs everything here; 8 runs the samples of DWIS-Blackboard-Samples as published (net8.0).
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Find the solution
        id: sln
        run: |
          f=$(ls *.sln *.slnx 2>/dev/null | head -1 || true)
          echo "file=$f" >> "$GITHUB_OUTPUT"
          if [ -z "$f" ]; then echo "No solution yet; nothing to build."; fi
      - name: Restore
        if: steps.sln.outputs.file != ''
        run: dotnet restore "${{ steps.sln.outputs.file }}"
      - name: Build
        if: steps.sln.outputs.file != ''
        run: dotnet build "${{ steps.sln.outputs.file }}" -c Release --no-restore
      - name: Test
        if: steps.sln.outputs.file != ''
        run: dotnet test "${{ steps.sln.outputs.file }}" -c Release --no-build --report-trx --results-directory TestResults
      - name: Upload test results
        if: always() && steps.sln.outputs.file != ''
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Validate the compose files
        run: |
          shopt -s nullglob
          files=(compose/*.yaml compose/*.yml ./compose.y*ml)
          if [ ${#files[@]} -eq 0 ]; then echo "No compose files yet."; exit 0; fi
          for f in "${files[@]}"; do echo "== $f"; docker compose -f "$f" config --quiet; done
      - name: The shipped closure of the vocabulary and the units is current (M5.6, decision D-47)
        if: hashFiles('tools/closure/make-closure.py') != ''
        run: |
          python3 -m pip install --quiet rdflib==7.6.0
          python3 tools/closure/make-closure.py --check
      - name: Decide whether the Fuseki image is built here or pulled
        id: fuseki
        if: hashFiles('fuseki/Dockerfile') != ''
        run: |
          # A pull request that touches the image sources tests its own build (tag ci). Any other run
          # pulls the edge image that the merge workflow pushed to Docker Hub, so the Fuseki jar is not
          # downloaded from Maven Central on every run.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- fuseki/ || echo fuseki/)
          else
            changed=fuseki/
          fi
          if [ -n "$changed" ]; then
            echo "tag=ci" >> "$GITHUB_OUTPUT"; echo "The Fuseki image sources changed: the image is built here."
          else
            echo "tag=edge" >> "$GITHUB_OUTPUT"; echo "The Fuseki image sources are unchanged: digiwells/dwis.blackboard.fuseki:edge is pulled."
          fi
      - name: Build the Fuseki image when its sources changed
        if: steps.fuseki.outputs.tag == 'ci'
        env:
          FUSEKI_TAG: ci
        run: docker compose -f compose/compose.yaml build fuseki
      - name: Pull the semantic and real-time edge images, and the Fuseki edge image when it is not built here
        if: hashFiles('fuseki/Dockerfile') != ''
        env:
          SEMANTIC_TAG: edge
          REALTIME_TAG: edge
          FUSEKI_TAG: ${{ steps.fuseki.outputs.tag }}
        run: |
          docker compose -f compose/compose.yaml pull semantic
          if [ "$FUSEKI_TAG" != "ci" ]; then docker compose -f compose/compose.yaml pull fuseki; fi
          # The real-time edge image is pushed by the merge workflow of DWIS-Blackboard-RealTime once the
          # organisation secrets reach that repository; until then it is built here from that repository's main.
          if ! docker compose -f compose/compose.yaml pull realtime; then
            echo "::notice::digiwells/dwis.blackboard.realtime:edge is not on Docker Hub; building it from DWIS-Blackboard-RealTime main."
            git clone --depth 1 https://github.com/D-WIS/DWIS-Blackboard-RealTime ../DWIS-Blackboard-RealTime
            docker compose -f compose/compose.yaml build realtime
          fi
      - name: Start the stack, load the vocabulary, run the checks and the demos
        if: hashFiles('fuseki/Dockerfile') != ''
        env:
          SEMANTIC_TAG: edge
          REALTIME_TAG: edge
          FUSEKI_TAG: ${{ steps.fuseki.outputs.tag }}
        run: ./compose/smoke.sh --no-build
      - name: Compatibility tests against the stack (M4.4; T-BC-4, T-EP-1, T-RT-3, T-RT-4, T-RT-6)
        if: hashFiles('fuseki/Dockerfile') != '' && steps.sln.outputs.file != ''
        env:
          DWIS_REALTIME_ENDPOINT: opc.tcp://127.0.0.1:48030
          DWIS_SEMANTIC_API: http://127.0.0.1:8080/api/v1
          DWIS_COMPOSE_FILE: compose/compose.yaml
        run: dotnet test "${{ steps.sln.outputs.file }}" -c Release --no-build --report-trx --results-directory TestResults/stack
      - name: Upload the stack test results
        if: always() && hashFiles('fuseki/Dockerfile') != '' && steps.sln.outputs.file != ''
        uses: actions/upload-artifact@v7
        with:
          name: test-results-stack
          path: TestResults/stack
          if-no-files-found: ignore
      - name: The samples of DWIS-Blackboard-Samples run unchanged against the stack (M4.4, T-BC-1)
        if: hashFiles('fuseki/Dockerfile') != ''
        run: ./compose/samples.sh
      - name: The conformance suite against the stack (M4.5, T-MOD-1)
        if: hashFiles('fuseki/Dockerfile') != '' && steps.sln.outputs.file != ''
        run: dotnet tools/conformance/bin/Release/net10.0/DWIS.Blackboard.Conformance.dll --endpoint opc.tcp://127.0.0.1:48030 --manifests fixtures/manifests/library --report-json TestResults/conformance/report.json --report TestResults/conformance/report.txt
      - name: Upload the conformance report
        if: always() && hashFiles('fuseki/Dockerfile') != '' && steps.sln.outputs.file != ''
        uses: actions/upload-artifact@v7
        with:
          name: conformance-report
          path: TestResults/conformance
          if-no-files-found: ignore
      - name: The SmartConnect bridge image injects and writes through the stack (M4.4, T-BC-2)
        if: hashFiles('fuseki/Dockerfile') != ''
        env:
          # The same tags as the smoke: compose resolves every service of the file, the bridge's dependencies included.
          SEMANTIC_TAG: edge
          REALTIME_TAG: edge
          FUSEKI_TAG: ${{ steps.fuseki.outputs.tag }}
        run: ./compose/bridge.sh
      - name: Start the hub profile, the old DWIS hub and a second Blackboard joined to it (M5.3)
        if: hashFiles('fuseki/Dockerfile') != ''
        env:
          SEMANTIC_TAG: edge
          REALTIME_TAG: edge
          FUSEKI_TAG: ${{ steps.fuseki.outputs.tag }}
        run: ./compose/hub.sh
      - name: Replication tests, two Blackboards through the hub (M5.3; T-HUB-1, T-HUB-2) and a recorded Unified Automation session replayed into it (M5.4; T-HUB-3)
        if: hashFiles('fuseki/Dockerfile') != '' && steps.sln.outputs.file != ''
        env:
          DWIS_REALTIME_ENDPOINT: opc.tcp://127.0.0.1:48030
          DWIS_SEMANTIC_API: http://127.0.0.1:8080/api/v1
          DWIS_REALTIME_ENDPOINT_B: opc.tcp://127.0.0.1:48031
          DWIS_SEMANTIC_API_B: http://127.0.0.1:8090/api/v1
          DWIS_HUB_URL: http://127.0.0.1:8082/blackboard/applications
          DWIS_COMPOSE_FILE: compose/compose.yaml
        # The replication class alone: the hub replays every manifest it ever saw to a process that reconnects, so the
        # restart test must not run with the hub role on and other tests after it.
        run: dotnet tests/DWIS.Blackboard.Compatibility.Tests/bin/Release/net10.0/DWIS.Blackboard.Compatibility.Tests.dll -class DWIS.Blackboard.Compatibility.Tests.ReplicationTests -result-trx TestResults/stack/replication.trx
      - name: Scan the Fuseki image built here
        if: steps.fuseki.outputs.tag == 'ci'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: digiwells/dwis.blackboard.fuseki:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Fuseki and service logs on failure
        if: failure() && hashFiles('fuseki/Dockerfile') != ''
        run: |
          docker compose -f compose/compose.yaml logs --no-log-prefix fuseki | tail -100
          docker compose -f compose/compose.yaml logs --no-log-prefix semantic | tail -100
          docker compose -f compose/compose.yaml logs --no-log-prefix realtime | tail -100
          docker compose -f compose/compose.yaml --profile bridge logs --no-log-prefix bridge | tail -60
          docker compose -f compose/compose.yaml --profile hub logs --no-log-prefix hub | tail -40
          docker compose -f compose/compose.yaml --profile hub logs --no-log-prefix semantic-b | tail -60
          docker compose -f compose/compose.yaml --profile hub logs --no-log-prefix realtime-b | tail -60
      - name: Stop the stack
        if: always() && hashFiles('fuseki/Dockerfile') != ''
        run: docker compose -f compose/compose.yaml --profile bridge --profile hub down -v
  models:
    name: TLC model checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Check the models with TLC (T-TST-1 to T-TST-3)
        run: bash ./models/check.sh
  scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Scan dependencies and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

