name: Pull request
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Find the solution
        id: sln
        run: |
          f=$(ls *.sln *.slnx 2>/dev/null | head -1 || true)
          echo "file=$f" >> "$GITHUB_OUTPUT"
          if [ -z "$f" ]; then echo "No solution yet; nothing to build."; fi
      - name: Restore
        if: steps.sln.outputs.file != ''
        run: dotnet restore "${{ steps.sln.outputs.file }}"
      - name: Build
        if: steps.sln.outputs.file != ''
        run: dotnet build "${{ steps.sln.outputs.file }}" -c Release --no-restore
      - name: Test
        if: steps.sln.outputs.file != ''
        run: dotnet test "${{ steps.sln.outputs.file }}" -c Release --no-build --report-trx --results-directory TestResults
      - name: Upload test results
        if: always() && steps.sln.outputs.file != ''
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Validate the compose files
        run: |
          shopt -s nullglob
          files=(compose/*.yaml compose/*.yml ./compose.y*ml)
          if [ ${#files[@]} -eq 0 ]; then echo "No compose files yet."; exit 0; fi
          for f in "${files[@]}"; do echo "== $f"; docker compose -f "$f" config --quiet; done
      - name: Build the Fuseki image, start the store, load the vocabulary, run the checks
        if: hashFiles('fuseki/Dockerfile') != ''
        run: ./compose/smoke.sh
      - name: Scan the Fuseki image
        if: hashFiles('fuseki/Dockerfile') != ''
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: digiwells/dwis.blackboard.fuseki:dev
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Fuseki logs on failure
        if: failure() && hashFiles('fuseki/Dockerfile') != ''
        run: docker compose -f compose/compose.yaml logs --no-log-prefix fuseki | tail -100
      - name: Stop the stack
        if: always() && hashFiles('fuseki/Dockerfile') != ''
        run: docker compose -f compose/compose.yaml down -v
  scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Scan dependencies and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

