\* The deliberately broken variant (T-TST-3): a commit no longer waits for the nodes. TLC must find a
\* state where a manifest is live and the running real-time process has no nodes for it.
SPECIFICATION Spec
CONSTANTS
  Manifests = {m1, m2}
  Contents = {a, b}
  TimeLimit = 2
  None = None
  CommitRequiresNodes = FALSE
INVARIANTS
  TypeOK
  NoLiveWithoutProvenance
  LiveHasNodesOrRebuild
  NoOrphanNodes
  NoStagedCopyOfLive
  NoExpiredEntry
  WholeOrNone
