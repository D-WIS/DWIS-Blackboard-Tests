\* The design (T-TST-2): two sessions sharing one query text, two rows; one round in flight at a time.
\* (A second query text multiplies the views and takes TLC past two million states for nothing new.)
SPECIFICATION Spec
CONSTANTS
  Sessions = {s1, s2}
  Queries = {q1}
  Rows = {r1, r2}
  None = None
INVARIANTS
  TypeOK
  NoOwnerClosed
  EntryIffOwned
  ViewsConsistentWhenIdle
  WaitingOnlyDuringRound
PROPERTIES
  FirstAnswerArrives
